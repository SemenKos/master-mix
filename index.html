<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">

<body>
<header>
  <h1><img src="./icon-192.png" alt="" class="brand-mark"><span id="title">Мастер микст</span></h1>
  <button class="btn sm" id="kb" onclick="toggleRu()" title="Печатать русскими буквами, даже если в системе стоит английская раскладка (переключение: F2)">Ввод: RU</button>
  <button class="btn sm" onclick="newTournament()">Новый турнир</button>
</header>
<main id="app"></main>
<div id="modal" onclick="if(event.target===this)closeModal()"></div>
<div id="toast" onclick="this.classList.remove('on')"></div>

<script src="./app.js" defer></script>
